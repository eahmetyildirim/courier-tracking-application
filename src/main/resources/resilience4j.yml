resilience4j:
  circuitbreaker:
    instances:
      locationProcessing:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
        ignore-exceptions:
          - com.migros.couriertracking.exception.CourierNotFoundException
          - com.migros.couriertracking.exception.IdempotencyConflictException
          - com.migros.couriertracking.exception.UnauthorizedRequestException
